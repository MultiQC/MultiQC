name: Flue Issue Triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    environment: anthropic
    permissions:
      issues: write
    defaults:
      run:
        working-directory: .flue
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0.4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .flue/package-lock.json
      - run: npm ci
      - name: Run triage agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npx flue run triage --target node \
            --id "triage-${{ github.event.issue.number }}" \
            --payload "$(jq -nc \
              --arg number "${{ github.event.issue.number }}" \
              --arg title "${{ github.event.issue.title }}" \
              --arg body  "${{ github.event.issue.body }}" \
              --arg author "${{ github.event.issue.user.login }}" \
              '{number: ($number|tonumber), title: $title, body: $body, author: $author}')" \
            > triage.json
          cat triage.json
      - name: Comment with triage result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          summary=$(jq -r '.summary' triage.json)
          category=$(jq -r '.category' triage.json)
          priority=$(jq -r '.priority' triage.json)
          labels=$(jq -r '.suggested_labels | join(", ")' triage.json)
          next=$(jq -r '.next_steps' triage.json)
          body=$(printf "**Automated triage** (Flue + Claude)\n\n**Category:** %s  \n**Priority:** %s  \n**Suggested labels:** %s\n\n**Summary**\n%s\n\n**Next steps**\n%s\n" \
            "$category" "$priority" "$labels" "$summary" "$next")
          gh issue comment "${{ github.event.issue.number }}" --body "$body"

      - name: Apply category label (chains to downstream agents)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          category=$(jq -r '.category' triage.json)
          # Map category picklist to a curated repo label. Unknown -> no label.
          case "$category" in
            bug)              label="bug" ;;
            feature-request)  label="enhancement" ;;
            module-request)   label="module: new" ;;
            docs)             label="documentation" ;;
            question)         label="question" ;;
            *)                label="" ;;
          esac
          if [ -n "$label" ]; then
            echo "Applying label: $label"
            # The "module: new" label, applied here, triggers flue-module-triage
            # via its issues:labeled handler. See .flue/AGENTS.md for the chain.
            gh issue edit "${{ github.event.issue.number }}" --add-label "$label"
          else
            echo "No label for category=$category"
          fi

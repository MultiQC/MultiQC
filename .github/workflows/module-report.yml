name: Module preview report

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number"
        required: true

permissions:
  contents: read

jobs:
  build:
    # PR code runs here, so this job gets a read-only token and no secrets.
    # The /review trigger phrase is kept in sync with claude-code-review-trigger.yml
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       (startsWith(github.event.comment.body, '/report') ||
        contains(github.event.comment.body, '/review')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      modules: ${{ steps.modules.outputs.modules }}
      report_url: ${{ steps.upload-report.outputs.artifact-url }}
      screenshot: ${{ steps.upload-screenshot.outputs.artifact-id != '' }}
    steps:
      - name: Require maintainer access
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.event.comment.user.login }}
        run: |
          PERM=$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" -q '.permission')
          echo "${ACTOR} has permission: $PERM"
          [[ "$PERM" =~ ^(admin|maintain|write)$ ]] || exit 1

      - name: Get PR number
        id: pr
        env:
          PR: ${{ github.event.issue.number || inputs.pr }}
        run: |
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "Invalid PR number: $PR"; exit 1; }
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      - name: Find edited modules
        id: modules
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.pr }}
        run: |
          MODULES=$(gh pr diff "$PR" --repo "$REPO" --name-only \
            | grep -oP '^multiqc/modules/\K[A-Za-z0-9_]+(?=/)' | sort -u | xargs)
          echo "Edited modules: ${MODULES:-none}"
          echo "modules=$MODULES" >> "$GITHUB_OUTPUT"

      - name: Check out PR
        if: steps.modules.outputs.modules != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ steps.pr.outputs.pr }}/head
          persist-credentials: false

      - name: Download test data
        if: steps.modules.outputs.modules != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MultiQC/test-data
          path: test-data
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.modules.outputs.modules != ''
        with:
          python-version: "3.12"

      - name: Install MultiQC
        if: steps.modules.outputs.modules != ''
        run: pip install .

      # MultiQC exits 0 without writing a report when no data matches
      - name: Run MultiQC
        if: steps.modules.outputs.modules != ''
        env:
          PR: ${{ steps.pr.outputs.pr }}
          MODULES: ${{ steps.modules.outputs.modules }}
        run: |
          ARGS=()
          for m in $MODULES; do ARGS+=(-m "$m"); done
          multiqc "${ARGS[@]}" test-data -n "multiqc_report_pr${PR}.html" -o report

      - name: Take screenshot
        id: screenshot
        if: hashFiles('report/*.html') != ''
        env:
          PR: ${{ steps.pr.outputs.pr }}
        run: |
          npx -y playwright@1.63.0 screenshot --channel chrome --full-page --viewport-size=1400,900 --wait-for-timeout=3000 \
            "file://$PWD/report/multiqc_report_pr${PR}.html" "report_pr${PR}.png"

      - name: Upload report
        id: upload-report
        if: hashFiles('report/*.html') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: report/multiqc_report_pr${{ steps.pr.outputs.pr }}.html
          archive: false
          retention-days: 30

      - name: Upload screenshot
        id: upload-screenshot
        if: steps.screenshot.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: report_pr${{ steps.pr.outputs.pr }}.png
          archive: false
          retention-days: 30

  comment:
    # Never checks out PR code: this is the only job with a write token.
    needs: build
    # A /review on a PR without module changes needs no comment
    if: |
      always() && needs.build.outputs.pr != '' &&
      (needs.build.outputs.modules != '' || needs.build.result != 'success' ||
       github.event_name == 'workflow_dispatch' || startsWith(github.event.comment.body, '/report'))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download screenshot
        if: needs.build.outputs.screenshot == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: report_pr${{ needs.build.outputs.pr }}.png

      - name: Post comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.build.outputs.pr }}
          MODULES: ${{ needs.build.outputs.modules }}
          REPORT_URL: ${{ needs.build.outputs.report_url }}
          RESULT: ${{ needs.build.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # shellcheck disable=SC2016
          MODS=$(echo "$MODULES" | sed -E 's/[^ ]+/`&`/g; s/ /, /g')
          if [ "$RESULT" != "success" ]; then
            TYPE=CAUTION BODY="Module preview report failed. See the [workflow logs]($RUN_URL)."
          elif [ -z "$MODULES" ]; then
            TYPE=NOTE BODY="No edited modules found in this PR, so no preview report was made."
          elif [ -z "$REPORT_URL" ]; then
            TYPE=WARNING BODY="No report generated for $MODS. See the [workflow logs]($RUN_URL)."
          else
            TYPE=TIP BODY="**[Module preview report]($REPORT_URL)** for $MODS (cmd+click to open in a new tab)"
          fi
          BODY=$(printf '> [!%s]\n> %s\n\n<sub>[Workflow run](%s)</sub>' "$TYPE" "$BODY" "$RUN_URL")

          SHOT="report_pr${PR}.png"
          if [ -f "$SHOT" ]; then
            DETAILS=$(printf '\n\n<details><summary>Screenshot</summary>\n\n![Report screenshot](./%s)\n\n</details>' "$SHOT")
            gh pr comment "$PR" --repo "$REPO" --body "$BODY$DETAILS" --attach "./$SHOT" && exit 0
            echo "::warning::Posting with screenshot attached failed, posting without it"
          fi
          gh pr comment "$PR" --repo "$REPO" --body "$BODY"

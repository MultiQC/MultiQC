name: Module preview report

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  build:
    # Runs PR code: never give this job write scopes or secrets.
    # Keep the /review match in sync with claude-code-review-trigger.yml.
    # Commands only count at line start; fromJSON is the only way to write a newline in an expression.
    if: |
      github.event.issue.pull_request &&
      (contains(format('{0}{1}', fromJSON('"\n"'), github.event.comment.body), format('{0}/report', fromJSON('"\n"'))) ||
       contains(format('{0}{1}', fromJSON('"\n"'), github.event.comment.body), format('{0}/review', fromJSON('"\n"'))))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      modules: ${{ steps.modules.outputs.modules }}
      report_url: ${{ steps.upload-report.outputs.artifact-url }}
      screenshot_url: ${{ steps.upload-screenshot.outputs.artifact-url }}
    steps:
      # Pin the head SHA now, so a push after the maintainer's comment can't change what runs.
      - name: Require maintainer access and pin the PR head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.event.comment.user.login }}
          PR: ${{ github.event.issue.number }}
        run: |
          PERM=$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" -q '.permission')
          echo "${ACTOR} has permission: $PERM"
          [[ "$PERM" =~ ^(admin|maintain|write)$ ]] || exit 1
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          gh pr view "$PR" --repo "$REPO" \
            --json headRefOid,headRepository,headRepositoryOwner \
            -q '"sha=\(.headRefOid)", "repo=\(.headRepositoryOwner.login)/\(.headRepository.name)"' \
            | tee -a "$GITHUB_OUTPUT"

      - name: Find edited modules
        id: modules
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.pr }}
        run: |
          MODULES=$(gh pr diff "$PR" --repo "$REPO" --name-only \
            | grep -oP '^multiqc/modules/\K[A-Za-z0-9_]+(?=/)' | sort -u | xargs)
          echo "Edited modules: ${MODULES:-none}"
          echo "modules=$MODULES" >> "$GITHUB_OUTPUT"

      - name: Check out PR
        if: steps.modules.outputs.modules != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.pr.outputs.repo }}
          ref: ${{ steps.pr.outputs.sha }}
          persist-credentials: false

      - name: Download test data
        if: steps.modules.outputs.modules != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MultiQC/test-data
          path: test-data
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.modules.outputs.modules != ''
        with:
          python-version: "3.12"

      - name: Install MultiQC
        if: steps.modules.outputs.modules != ''
        run: pip install .

      # MultiQC exits 0 without writing a report when no data matches
      - name: Run MultiQC
        if: steps.modules.outputs.modules != ''
        env:
          PR: ${{ steps.pr.outputs.pr }}
          MODULES: ${{ steps.modules.outputs.modules }}
        run: |
          ARGS=()
          for m in $MODULES; do ARGS+=(-m "$m"); done
          multiqc "${ARGS[@]}" test-data -n "multiqc_report_pr${PR}.html" -o report

      - name: Take screenshot
        id: screenshot
        if: hashFiles('report/*.html') != ''
        continue-on-error: true
        env:
          PR: ${{ steps.pr.outputs.pr }}
        # --full-page leaves the fixed sidebar overlapping content; re-shoot with a page-tall viewport
        run: |
          URL="file://$PWD/report/multiqc_report_pr${PR}.html"
          SHOT="report_pr${PR}.png"
          npx -y playwright@1.63.0 screenshot --channel chrome --full-page --viewport-size=1400,900 "$URL" "$SHOT"
          HEIGHT=$(python3 -c "import struct, sys; print(struct.unpack('>I', open(sys.argv[1], 'rb').read()[20:24])[0])" "$SHOT")
          npx -y playwright@1.63.0 screenshot --channel chrome --viewport-size="1400,$HEIGHT" --wait-for-timeout=3000 "$URL" "$SHOT"

      - name: Upload report
        id: upload-report
        if: hashFiles('report/*.html') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: report/multiqc_report_pr${{ steps.pr.outputs.pr }}.html
          archive: false
          retention-days: 30

      - name: Upload screenshot
        id: upload-screenshot
        if: steps.screenshot.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: report_pr${{ steps.pr.outputs.pr }}.png
          archive: false
          retention-days: 30

  comment:
    # Never checks out PR code: it holds the bot token.
    needs: build
    # A /review on a PR without module changes needs no comment
    if: |
      always() && needs.build.outputs.pr != '' &&
      (needs.build.outputs.modules != '' || needs.build.result != 'success' ||
       contains(format('{0}{1}', fromJSON('"\n"'), github.event.comment.body), format('{0}/report', fromJSON('"\n"'))))
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Download screenshot
        if: needs.build.outputs.screenshot_url != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: report_pr${{ needs.build.outputs.pr }}.png

      - name: Post comment
        env:
          # gh --attach rejects the Actions token; it needs a PAT
          GH_TOKEN: ${{ secrets.MQC_BOT_GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.build.outputs.pr }}
          MODULES: ${{ needs.build.outputs.modules }}
          REPORT_URL: ${{ needs.build.outputs.report_url }}
          SCREENSHOT_URL: ${{ needs.build.outputs.screenshot_url }}
          RESULT: ${{ needs.build.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # shellcheck disable=SC2016
          MODS=$(echo "$MODULES" | sed -E 's/[^ ]+/`&`/g; s/ /, /g')
          RUN=" See [run]($RUN_URL)."
          SHOT="report_pr${PR}.png"
          if [ "$RESULT" != "success" ]; then
            BODY="❌ MultiQC preview report failed."
          elif [ -z "$MODULES" ]; then
            BODY="ℹ️ No edited modules found, so no MultiQC preview report."
          elif [ -z "$REPORT_URL" ]; then
            BODY="⚠️ No MultiQC preview report generated for $MODS."
          elif [ -f "$SHOT" ]; then
            BODY="✅ **[MultiQC preview report]($REPORT_URL)** generated for $MODS."
            DETAILS=$(printf '\n\n<details><summary>Screenshot</summary>\n\n![MultiQC report screenshot](./%s)\n\n</details>' "$SHOT")
            gh pr comment "$PR" --repo "$REPO" --body "$BODY$RUN$DETAILS" --attach "./$SHOT" && exit 0
            BODY="✅ **[MultiQC preview report]($REPORT_URL)** generated for $MODS (⚠️ screenshot upload failed, [view it here]($SCREENSHOT_URL))."
          else
            BODY="✅ **[MultiQC preview report]($REPORT_URL)** generated for $MODS (⚠️ screenshot failed)."
          fi
          gh pr comment "$PR" --repo "$REPO" --body "$BODY$RUN"
